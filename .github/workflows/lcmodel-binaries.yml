####################################################################################################
# Builds portable LCModel binaries and a container image from the pinned upstream source.
#
#   linux  x86_64 / aarch64  - fully static, built in docker/dockerfile
#   macOS  x86_64 / arm64    - libgfortran/libgcc linked statically, built directly on the runner
#   image  ghcr.io/<owner>/lcmodel  - the Linux binary as a multi-arch image (amd64 + arm64)
#
# Upstream (schorschinho/LCModel) ships no aarch64 Linux build, and its macOS builds link the
# builder's Homebrew libgfortran dynamically, so an M1 build fails on an M4 machine with a
# different Homebrew layout. These artifacts close both gaps. They are meant to be offered
# upstream first; the release here is what PyLCModel falls back to in the meantime.
#
# Native runners on purpose: compiling LCModel.f (600 KB of -O3 Fortran with ~350 MB of
# static data) under QEMU takes 30-60+ minutes and is memory-hostile. The image is therefore
# pushed per architecture by digest and merged into one manifest afterwards.
#
# Every push to main and every pull request that touches the build inputs builds and tests.
# A version tag ("v0.3.0"; lcmodel_wrapper/_version.py is the source of truth) additionally
# publishes: image to GHCR, binaries to the GitHub release, wheel to PyPI. A manual run
# publishes the image as ":edge" only.
####################################################################################################

name: lcmodel-binaries

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths:
      - 'docker/**'
      - 'lcmodel_wrapper/**'
      - 'tests/**'
      - 'example_data/**'
      - '.github/workflows/lcmodel-binaries.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'lcmodel_wrapper/**'
      - 'tests/**'
      - 'example_data/**'
      - '.github/workflows/lcmodel-binaries.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *'   # monthly, to catch upstream source drift via the checksum step

permissions:
  contents: read

env:
  # Pinned upstream commit. Bumping this changes the numerics, so it is a deliberate,
  # reviewable edit - keep it in step with docker/lcmodel-src.sha256.
  LCMODEL_REF: c9d95ff9b1fd2e7e8b256088ba1f5cf4df5fb207
  # Must be lowercase for the registry; the owner login already is.
  IMAGE: ghcr.io/${{ github.repository_owner }}/lcmodel
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
  # No ".dockerbuild" debug artifacts on every run
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  #------------------------------------------------------------------------------------------#
  #  Linux: static binary via docker/dockerfile, plus the per-arch image                         #
  #------------------------------------------------------------------------------------------#
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm    # native ARM runner; no QEMU
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Build LCModel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          build-args: LCMODEL_REF=${{ env.LCMODEL_REF }}
          load: true
          tags: lcmodel-build:${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Extract the binary
        run: |
          # "docker create" never runs the entrypoint, so this works on a scratch image
          # with no shell.
          cid=$(docker create lcmodel-build:${{ matrix.arch }})
          docker cp "$cid:/usr/local/bin/lcmodel" ./lcmodel
          docker cp "$cid:/licenses/LICENSE.lcmodel" ./LICENSE.lcmodel
          docker cp "$cid:/licenses/NOTICE" ./NOTICE.lcmodel
          docker rm "$cid"
          chmod +x ./lcmodel
          file ./lcmodel
          ls -lh ./lcmodel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the wrapper
        run: pip install -q -e '.[test]'

      - name: Fit the challenge data with the new binary
        # The acceptance test: LCModel exits 0 even on fatal errors, so only a fit that
        # reproduces the reference error proves the build is good.
        run: LCMODEL_EXEC="$PWD/lcmodel" python -m pytest tests/test_lcm.py -q

      - name: Fit the challenge data through the image
        # Exactly what a Docker user runs: the launcher from binaries.py in front of the
        # image, working directory bind-mounted, non-root uid.
        run: |
          launcher=$(python -c "from pathlib import Path; from lcmodel_wrapper import binaries; \
            print(binaries._write_shim(Path.cwd(), 'docker', 'lcmodel-build:${{ matrix.arch }}'))")
          LCMODEL_EXEC="$launcher" python -m pytest tests/test_lcm.py -q

      - name: Compress
        run: |
          # ~113 MB raw, but almost all of it is zero-initialised Fortran DATA, so it
          # compresses to a few hundred KB.
          xz -9 -k -c ./lcmodel > "lcmodel-linux-${{ matrix.arch }}.xz"
          ls -lh "lcmodel-linux-${{ matrix.arch }}.xz"
          sha256sum "lcmodel-linux-${{ matrix.arch }}.xz" \
            | tee "lcmodel-linux-${{ matrix.arch }}.xz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lcmodel-linux-${{ matrix.arch }}
          path: |
            lcmodel-linux-${{ matrix.arch }}.xz
            lcmodel-linux-${{ matrix.arch }}.xz.sha256
            LICENSE.lcmodel
            NOTICE.lcmodel
          retention-days: 14

      #-- image publishing (tag / manual runs only) --------------------------------------#
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image by digest
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          build-args: LCMODEL_REF=${{ env.LCMODEL_REF }}
          platforms: linux/${{ matrix.platform }}
          # Untagged push; the "image" job below stitches both digests into one manifest.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  #------------------------------------------------------------------------------------------#
  #  macOS: built directly on the runner, libgfortran linked statically                       #
  #------------------------------------------------------------------------------------------#
  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14            # oldest arm64 image: oldest SDK, widest reach
            deployment_target: '12.0'   # Monterey, the first macOS upstream ever built for
          - arch: x86_64
            runner: macos-15-intel
            deployment_target: '10.15'  # Catalina, matching upstream's Intel build
    env:
      FC: gfortran-14
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch the pinned upstream source
        run: |
          mkdir -p src && cd src
          raw="https://raw.githubusercontent.com/schorschinho/LCModel/${LCMODEL_REF}/source"
          for f in LCModel.f lcmodel.inc lipid-1.inc liver-1.inc muscle-1.inc \
                   nml_lcmodel.inc nml_lcmodl.inc; do
            curl -fsSL --retry 3 --retry-delay 2 -o "$f" "$raw/$f"
          done
          shasum -a 256 -c ../docker/lcmodel-src.sha256

      - name: Compile
        working-directory: src
        run: |
          "$FC" --version | head -1
          # Same flags as upstream's Makefile so the numerics match the community builds.
          "$FC" -c -fno-backslash -fno-f2c -O3 -fall-intrinsics -std=legacy \
                -Wuninitialized -ffpe-summary=none LCModel.f -o LCModel.o
          # -static-libgfortran covers libgfortran but the driver still adds -lquadmath,
          # and Apple's linker prefers the .dylib when it sits beside the .a. A private
          # directory holding only the archive, searched first, is the standard fix.
          mkdir -p static
          cp "$("$FC" -print-file-name=libquadmath.a)" static/
          "$FC" -static-libgfortran -static-libgcc -L"$PWD/static" LCModel.o -o lcmodel
          cp lcmodel ../lcmodel

      - name: Check portability
        run: |
          # The whole point of this job: nothing may resolve to the builder's Homebrew.
          otool -L ./lcmodel
          if otool -L ./lcmodel | grep -qE '/(opt/homebrew|usr/local)/'; then
            echo "binary still links a Homebrew library" >&2; exit 1
          fi
          otool -l ./lcmodel | grep -A3 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' | grep -E 'minos|version' || true
          # LCModel exits 0 even on fatal errors (Fortran STOP), so assert on output.
          ./lcmodel < /dev/null 2>&1 | grep -q 'MYCONT' \
            || { echo "binary does not identify itself as LCModel" >&2; exit 1; }
          echo "self-test ok"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the wrapper
        run: pip install -q -e '.[test]'

      - name: Fit the challenge data with the new binary
        run: LCMODEL_EXEC="$PWD/lcmodel" python -m pytest tests/test_lcm.py -q

      - name: Compress
        run: |
          command -v xz >/dev/null || brew install xz
          xz -9 -k -c ./lcmodel > "lcmodel-macos-${{ matrix.arch }}.xz"
          ls -lh "lcmodel-macos-${{ matrix.arch }}.xz"
          shasum -a 256 "lcmodel-macos-${{ matrix.arch }}.xz" \
            | tee "lcmodel-macos-${{ matrix.arch }}.xz.sha256"
          cp NOTICE NOTICE.lcmodel   # LICENSE.lcmodel is already at the repo root

      - uses: actions/upload-artifact@v4
        with:
          name: lcmodel-macos-${{ matrix.arch }}
          path: |
            lcmodel-macos-${{ matrix.arch }}.xz
            lcmodel-macos-${{ matrix.arch }}.xz.sha256
            LICENSE.lcmodel
            NOTICE.lcmodel
          retention-days: 14

  #------------------------------------------------------------------------------------------#
  #  merge the per-arch image digests into one multi-arch tag                                 #
  #------------------------------------------------------------------------------------------#
  image:
    name: publish multi-arch image
    needs: linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          # A tag push gets its own tag plus "latest"; a manual run only "edge", so that
          # what PyLCModel pulls by default (the release tag) is never moved by hand.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags=("${GITHUB_REF#refs/tags/}" latest)
          else
            tags=(edge)
          fi
          args=()
          for t in "${tags[@]}"; do args+=(-t "${IMAGE}:${t}"); done
          docker buildx imagetools create "${args[@]}" $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${tags[0]}"

  #------------------------------------------------------------------------------------------#
  #  attach every binary to the release                                                       #
  #------------------------------------------------------------------------------------------#
  release:
    name: attach to release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lcmodel-*
          merge-multiple: true

      - run: ls -lhR dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            PyLCModel ${{ github.ref_name }} (`pip install lcmodel-wrapper`).

            Attached: portable LCModel binaries built from upstream source
            `${{ env.LCMODEL_REF }}`, unmodified, which this version of the wrapper
            downloads on demand when no community binary fits the machine:

            - `lcmodel-linux-x86_64.xz`, `lcmodel-linux-aarch64.xz` - fully static
            - `lcmodel-macos-arm64.xz` (macOS 12+), `lcmodel-macos-x86_64.xz` (macOS 10.15+)
              - libgfortran linked statically, no Homebrew needed
            - container image: `${{ env.IMAGE }}:${{ github.ref_name }}` (linux/amd64, linux/arm64)

            Each `.xz` has a `.sha256` sidecar; PyLCModel verifies it before use.

            LCModel is a separate BSD-3-Clause program by Stephen Provencher.
            See `LICENSE.lcmodel` attached here and on the
            [LCModel home page](https://s-provencher.com/lcmodel.shtml).

  #------------------------------------------------------------------------------------------#
  #  publish the wheel - after the release exists, so a wheel never precedes its binaries    #
  #------------------------------------------------------------------------------------------#
  pypi:
    name: publish to PyPI
    needs: [release, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the package version
        # The wheel pulls the release tagged "v<version>", so the two must agree.
        run: |
          version=$(python -c "from lcmodel_wrapper._version import __version__; print(__version__)")
          [ "v${version}" = "${GITHUB_REF_NAME}" ] \
            || { echo "tag ${GITHUB_REF_NAME} but _version.py says ${version}" >&2; exit 1; }

      - name: Build sdist and wheel
        run: pip install -q build && python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
