[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcmodel_wrapper"
dynamic = ["version"]
description = "Lightweight Python wrapper for LCModel MRS fitting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
  { name = "Julian Merkofer", email = "j.p.merkofer@tue.nl" }
]

# Core stays light: no LCModel code or binary in the wheel. One is resolved on first
# use - downloaded from https://github.com/schorschinho/LCModel or this repo's
# releases, run from the ghcr.io/julianmer/lcmodel image, or built via gfortran.
dependencies = [
  "numpy>=1.22",
  "scipy>=1.10",
  "nibabel>=4.0",
  "nifti-mrs>=1.0"
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pandas>=1.4", "openpyxl>=3.0"]

[project.urls]
Homepage = "https://github.com/julianmer/PyLCModel"
Repository = "https://github.com/julianmer/PyLCModel"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.dynamic]
version = { attr = "lcmodel_wrapper._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["lcmodel_wrapper*"]
